:root{--bg:#f4f6f8;--card:#fff;--text:#20252b;--muted:#718096;--line:#e5e9ee;--blue:#1769d2;--soft:#f3f8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select{font:inherit}.app{min-height:100vh}.header{position:fixed;top:0;left:0;right:0;height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 13px;z-index:20}.title{font-size:20px;font-weight:900}.cloud-status{font-size:10px;color:#718096;margin-top:2px}.cloud-status.ok{color:#2e8b57}.cloud-status.err{color:#d32f2f}.install-btn{display:none;margin-top:5px;border:0;background:#eaf2ff;color:#1769d2;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.install-btn.show{display:inline-block}.menu{border:0;background:transparent;font-size:28px}.main{max-width:560px;margin:auto;padding:84px 12px 145px}.screen{display:none}.screen.active{display:block}.panel,.card,.dbcard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.04)}.panel{padding:11px;margin-bottom:10px}.row{display:grid;grid-template-columns:1fr 46px;gap:8px;margin-top:7px}select,input{height:44px;border:1px solid #dfe5ea;border-radius:10px;background:#fff;padding:0 11px;width:100%}.plus,.dark{border:0;border-radius:10px;background:#20252b;color:#fff;font-weight:900}.plus{font-size:24px}.dark{padding:0 14px}.list,.dblist{display:grid;gap:8px}.card{display:grid;grid-template-columns:minmax(0,1fr) 72px 104px;gap:6px;align-items:center;padding:8px 9px;min-height:56px}.card.sel{background:var(--soft);border-color:#cfe2ff}.prod{min-width:0}.name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta,.small{font-size:11px;color:var(--muted);margin-top:3px}.price{text-align:right;font-weight:900;white-space:nowrap}.qty{display:grid;grid-template-columns:30px 34px 30px;gap:3px;align-items:center}.qty button{height:32px;border:1px solid #79aaf0;background:#fff;color:var(--blue);border-radius:8px;font-size:20px}.qty span{text-align:center;font-weight:900}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:19;box-shadow:0 -8px 24px rgba(15,23,42,.08)}.bottom.hide{display:none}.bi{max-width:560px;margin:auto}.sum{display:flex;justify-content:space-between;align-items:end;padding:0 3px 8px;font-weight:900}.total{font-size:24px}.primary{width:100%;height:50px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:18px;font-weight:900}.toolbar{display:grid;grid-template-columns:1fr 130px;gap:8px;margin-bottom:9px}.dbhead{display:flex;align-items:center;justify-content:space-between}.dbtitle{font-size:19px;font-weight:900}.dbcard{padding:10px}
.master-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.master-tabs button{height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:900}
.master-tabs button.active{background:#edf5ff;color:var(--blue);border-color:#b8d4f7}
.master-list{display:grid;gap:8px}
.master-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;box-shadow:0 3px 12px rgba(15,23,42,.04)}
.master-name{font-size:16px;font-weight:900}
.master-sub{font-size:11px;color:var(--muted);margin-top:3px}
.master-actions{display:flex;gap:5px}
.master-actions button{height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:800;padding:0 10px}
.master-actions .danger{color:#d32f2f;border-color:#f0b9bd}
.master-note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}.dbtop{display:flex;justify-content:space-between;gap:8px}.dbcard.off{opacity:.55}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:11px;background:#f1f4f7;border-radius:999px;padding:4px 8px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.actions button,.ord button{height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:800}.ord{display:flex;gap:5px}.ord button{width:34px}.back{position:fixed;inset:0;background:rgba(0,0,0,.36);opacity:0;pointer-events:none;transition:.2s;z-index:30}.back.open{opacity:1;pointer-events:auto}.drawer{position:fixed;top:0;right:0;width:min(82vw,320px);height:100vh;background:#fff;transform:translateX(100%);transition:.2s;z-index:31;padding:18px 14px}.drawer.open{transform:none}.dhead,.shead{display:flex;justify-content:space-between;align-items:center}.nav{display:grid;gap:9px;margin-top:20px}.nav button{height:48px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 13px;font-weight:900}.nav button.active{background:#edf5ff;color:var(--blue)}.x{width:40px;height:40px;border:0;border-radius:10px;background:#f2f4f6;font-size:20px}.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:#fff;border-radius:22px 22px 0 0;transform:translateY(105%);transition:.2s;z-index:41;overflow:hidden}.sheet.open{transform:none}.sin{max-width:560px;margin:auto;display:flex;flex-direction:column;max-height:90vh}.shead{padding:15px 13px 10px;border-bottom:1px solid var(--line)}.sbody{padding:10px 12px;overflow:auto}.sfoot{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.form{display:grid;gap:11px}.field label{display:block;font-size:14px;font-weight:900;margin-bottom:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.switchrow{display:flex;justify-content:space-between;align-items:center;background:#f6f8fa;border-radius:10px;padding:10px}.sw{position:relative;width:50px;height:28px;border:0;border-radius:99px;background:#cbd2d9}.sw.on{background:#43b96e}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff}.sw.on:after{left:25px}.li{display:grid;grid-template-columns:minmax(0,1fr) 104px 38px;gap:7px;align-items:center;min-height:56px;border-bottom:1px solid var(--line)}.trash{width:36px;height:36px;border:0;border-radius:9px;background:#fff0f1;color:#d32f2f}.empty{padding:26px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:14px}.toast{position:fixed;left:50%;bottom:135px;transform:translateX(-50%);background:#20252b;color:#fff;padding:9px 13px;border-radius:99px;opacity:0;z-index:60}.toast.show{opacity:1}@media(min-width:700px){.app{width:420px;margin:auto;box-shadow:0 0 30px rgba(0,0,0,.12)}.header,.bottom{left:50%;right:auto;width:420px;transform:translateX(-50%)}.sheet{left:50%;right:auto;width:420px;transform:translate(-50%,105%)}.sheet.open{transform:translate(-50%,0)}}

</head><body><div class='app'><header class='header'><div><div class='title' id='ht'>3208 買い物リスト</div><div class='cloud-status' id='cloudStatus'>クラウド接続中...</div><button class='install-btn' id='installBtn'>ホーム画面に追加</button></div><button class='menu' id='mb'>☰</button></header><main class='main'>
<section class='screen active' id='shop'><div class='panel'><div class='small'>業者</div><div class='row'><select id='vs'></select><button class='plus' id='qa'>＋</button></div></div><div class='list' id='plist'></div></section>
<section class='screen' id='db'><div class='panel'><div class='dbhead'><div><div class='dbtitle'>商品データベース</div><div class='small' id='dbc'></div></div><button class='dark' id='na'>＋ 新規</button></div></div><div class='toolbar'><input id='search' placeholder='商品名・業者で検索'><select id='vf'><option value=''>全業者</option></select></div><div class='dblist' id='dbl'></div></section>
<section class='screen' id='master'><div class='panel'><div class='dbhead'><div><div class='dbtitle'>マスタ管理</div><div class='small'>業者・保管科目・税率</div></div><button class='dark' id='ma'>＋ 追加</button></div></div><div class='master-tabs'><button id='mtv' class='active'>業者</button><button id='mtc'>科目</button><button id='mtt'>税率</button></div><div class='master-list' id='mlist'></div><div class='master-note'>使用中のマスタは削除できません。名前や税率を変更すると、登録済みの商品にも反映されます。</div></section></main>
<div class='bottom' id='bottom'><div class='bi'><div class='sum'><span id='cnt'>0商品</span><span><small>税込</small> <span class='total' id='tot'>0円</span></span></div><button class='primary' id='ol'>買い物リストを見る</button></div></div>
<div class='back' id='dbk'></div><aside class='drawer' id='drawer'><div class='dhead'><b style='font-size:20px'>メニュー</b><button class='x' id='dc'>×</button></div><div class='nav'><button id='nshop' class='active'>商品一覧</button><button id='nlist'>買い物リスト</button><button id='ndb'>商品DB</button><button id='nmaster'>マスタ管理</button></div></aside>
<div class='back' id='sbk'></div><section class='sheet' id='ls'><div class='sin'><div class='shead'><b style='font-size:20px'>買い物リスト</b><button class='x cls'>×</button></div><div class='sbody' id='lbody'></div><div class='sfoot'><div class='sum'><span id='sc'>0商品</span><span id='st'>税込 0円</span></div><button class='primary cls'>閉じる</button></div></div></section>
<section class='sheet' id='ps'><div class='sin'><div class='shead'><b style='font-size:20px' id='pst'>商品を追加</b><button class='x cls'>×</button></div><div class='sbody'><form class='form' id='form'><input type='hidden' id='eid'><div class='field'><label>商品名</label><input id='pn' required placeholder='例：鶏もも肉 2kg'><div class='small'>内容量や単位は商品名に含める。</div></div><div class='field'><label>業者</label><select id='pv'></select></div><div class='field'><label>保管科目</label><select id='pc'></select></div><div class='two'><div class='field'><label>税抜単価</label><input id='pp' type='number' min='0' required></div><div class='field'><label>税率</label><select id='pt'></select></div></div><div class='field'><label>表示順</label><input id='po' type='number' min='1' required></div><div class='switchrow'><div><b>使用状態</b><div class='small'>OFFは買い物画面に表示しない</div></div><button type='button' class='sw on' id='sw'></button></div><button class='primary'>保存する</button></form></div></div></section><section class='sheet' id='ms'><div class='sin'><div class='shead'><b style='font-size:20px' id='mst'>マスタを追加</b><button class='x cls'>×</button></div><div class='sbody'><form class='form' id='mform'><input type='hidden' id='mid'><input type='hidden' id='mtype'><div class='field'><label id='mfieldlabel'>名称</label><input id='mvalue' required></div><button class='primary'>保存する</button></form></div></div></section><div class='toast' id='toast'></div></div>
<script>
const SUPABASE_URL='https://dccjyfvduaggocftlctc.supabase.co';
const SUPABASE_KEY='sb_publishable_8tNG5iv_gC3q9cujD1w8Sw_ecNWVA__';
const VK='s3208_vendor_cloud_v1';

let m={vendors:[],categories:[],taxes:[]};
let p=[];
let masterType='vendor';
let busy=false;

const esc=s=>String(s).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const yen=n=>Number(n).toLocaleString('ja-JP')+'円';
const vn=id=>m.vendors.find(x=>x.id===id)?.name||'未設定';
const cn=id=>m.categories.find(x=>x.id===id)?.name||'その他';
const tr=id=>m.taxes.find(x=>x.id===id)?.rate??0;
const g=x=>Math.ceil(x.net*(1+tr(x.taxId)/100));

async function api(table,{method='GET',query='',body=null,prefer='return=representation'}={}){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`,{
    method,
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:`Bearer ${SUPABASE_KEY}`,
      'Content-Type':'application/json',
      Prefer:prefer
    },
    body:body===null?null:JSON.stringify(body)
  });
  if(!r.ok){
    let text=await r.text();
    throw new Error(`${r.status} ${text}`);
  }
  if(r.status===204)return null;
  const text=await r.text();
  return text?JSON.parse(text):null;
}

function dbToProduct(x){
  return {
    id:x.id,name:x.name,vendorId:x.vendor_id,categoryId:x.category_id,
    taxId:x.tax_id,net:Number(x.net_price),order:Number(x.display_order),
    active:Boolean(x.active),qty:Number(x.quantity||0)
  };
}
function productToDb(x){
  return {
    id:x.id,name:x.name,vendor_id:x.vendorId,category_id:x.categoryId,
    tax_id:x.taxId,net_price:Number(x.net),display_order:Number(x.order),
    active:Boolean(x.active),quantity:Number(x.qty||0),updated_at:new Date().toISOString()
  };
}

async function loadCloud(){
  setCloud('クラウド接続中...');
  try{
    const [vendors,categories,taxes,products]=await Promise.all([
      api('vendors',{query:'?select=*&order=display_order.asc'}),
      api('categories',{query:'?select=*&order=display_order.asc'}),
      api('tax_rates',{query:'?select=*&order=display_order.asc'}),
      api('products',{query:'?select=*&order=display_order.asc'})
    ]);
    m.vendors=(vendors||[]).filter(x=>x.active!==false).map(x=>({id:x.id,name:x.name,order:Number(x.display_order||0)}));
    m.categories=(categories||[]).filter(x=>x.active!==false).map(x=>({id:x.id,name:x.name,order:Number(x.display_order||0)}));
    m.taxes=(taxes||[]).filter(x=>x.active!==false).map(x=>({id:x.id,rate:Number(x.rate),order:Number(x.display_order||0)}));
    p=(products||[]).map(dbToProduct);
    masters();
    renderShop();
    renderDb();
    renderMasters();
    setCloud('クラウド接続済み','ok');
  }catch(e){
    console.error(e);
    setCloud('接続エラー','err');
    msg('Supabaseへ接続できません');
  }
}
function setCloud(text,cls=''){
  cloudStatus.textContent=text;
  cloudStatus.className='cloud-status '+cls;
}
function lock(v){
  busy=v;
  document.querySelectorAll('button,input,select').forEach(el=>el.disabled=v);
}
async function runCloud(fn,success){
  if(busy)return;
  lock(true);
  try{
    await fn();
    await loadCloud();
    if(success)msg(success);
  }catch(e){
    console.error(e);
    msg('保存できませんでした');
    setCloud('保存エラー','err');
  }finally{
    lock(false);
  }
}

function masters(){
  const keep=vs.value||localStorage.getItem(VK);
  vs.innerHTML=pv.innerHTML='';
  vf.innerHTML='<option value="">全業者</option>';
  m.vendors.forEach(x=>{
    vs.add(new Option(x.name,x.id));
    pv.add(new Option(x.name,x.id));
    vf.add(new Option(x.name,x.id));
  });
  pc.innerHTML='';
  m.categories.forEach(x=>pc.add(new Option(x.name,x.id)));
  pt.innerHTML='';
  m.taxes.forEach(x=>pt.add(new Option(x.rate+'%',x.id)));
  if(keep&&m.vendors.some(x=>x.id===keep))vs.value=keep;
  else if(m.vendors[0])vs.value=m.vendors[0].id;
}
function summary(){
  const a=p.filter(x=>x.active&&x.qty>0),sum=a.reduce((z,x)=>z+g(x)*x.qty,0);
  cnt.textContent=sc.textContent=a.length+'商品';
  tot.textContent=yen(sum);
  st.textContent='税込 '+yen(sum);
}
function renderShop(){
  const a=p.filter(x=>x.active&&x.vendorId===vs.value).sort((a,b)=>a.order-b.order);
  plist.innerHTML=a.length?a.map(x=>`<article class='card ${x.qty?'sel':''}'><div class='prod'><div class='name'>${esc(x.name)}</div><div class='meta'>${cn(x.categoryId)}・税率 ${tr(x.taxId)}%</div></div><div class='price'>${yen(g(x))}</div><div class='qty'><button onclick="qty('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="qty('${x.id}',1)">＋</button></div></article>`).join(''):`<div class='empty'>この業者の商品はありません</div>`;
  summary();
}
async function qty(id,d,from=false){
  const x=p.find(y=>y.id===id);if(!x)return;
  const value=Math.max(0,x.qty+d);
  x.qty=value;renderShop();if(from||ls.classList.contains('open'))renderList();
  try{
    await api('products',{method:'PATCH',query:`?id=eq.${encodeURIComponent(id)}`,body:{quantity:value,updated_at:new Date().toISOString()},prefer:'return=minimal'});
    setCloud('クラウド接続済み','ok');
  }catch(e){
    console.error(e);await loadCloud();msg('数量を保存できませんでした');
  }
}
function renderList(){
  const a=p.filter(x=>x.active&&x.qty>0).sort((a,b)=>vn(a.vendorId).localeCompare(vn(b.vendorId),'ja')||a.order-b.order);
  lbody.innerHTML=a.length?a.map(x=>`<div class='li'><div><div class='name'>${esc(x.name)}</div><div class='small'>${vn(x.vendorId)}</div></div><div class='qty'><button onclick="qty('${x.id}',-1,true)">−</button><span>${x.qty}</span><button onclick="qty('${x.id}',1,true)">＋</button></div><button class='trash' onclick="rem('${x.id}')">×</button></div>`).join(''):`<div class='empty'>商品が選択されていません</div>`;
  summary();
}
async function rem(id){
  await runCloud(()=>api('products',{method:'PATCH',query:`?id=eq.${encodeURIComponent(id)}`,body:{quantity:0,updated_at:new Date().toISOString()},prefer:'return=minimal'}),'削除しました');
  renderList();
}
function renderDb(){
  const q=search.value.trim().toLowerCase(),v=vf.value;
  const a=p.filter(x=>(!q||x.name.toLowerCase().includes(q)||vn(x.vendorId).toLowerCase().includes(q))&&(!v||x.vendorId===v)).sort((a,b)=>a.order-b.order);
  dbc.textContent=`登録 ${p.length}件／使用中 ${p.filter(x=>x.active).length}件`;
  dbl.innerHTML=a.length?a.map(x=>`<article class='dbcard ${x.active?'':'off'}'><div class='dbtop'><div><div class='name'>${esc(x.name)}</div><div class='small'>${x.id}　表示順 ${x.order}</div></div><div class='ord'><button onclick="move('${x.id}',-1)">↑</button><button onclick="move('${x.id}',1)">↓</button></div></div><div class='tags'><span class='tag'>${vn(x.vendorId)}</span><span class='tag'>${cn(x.categoryId)}</span><span class='tag'>税抜 ${yen(x.net)}</span><span class='tag'>${tr(x.taxId)}%</span><span class='tag'>${x.active?'ON':'OFF'}</span></div><div class='actions'><button onclick="edit('${x.id}')">編集</button><button onclick="toggle('${x.id}')">${x.active?'OFFにする':'ONにする'}</button><button onclick="dup('${x.id}')">複製</button></div></article>`).join(''):`<div class='empty'>該当商品なし</div>`;
}
async function move(id,d){
  const a=[...p].sort((x,y)=>x.order-y.order),i=a.findIndex(x=>x.id===id),j=i+d;
  if(i<0||j<0||j>=a.length)return;
  const oi=a[i].order,oj=a[j].order;
  await runCloud(async()=>{
    await api('products',{method:'PATCH',query:`?id=eq.${encodeURIComponent(a[i].id)}`,body:{display_order:oj},prefer:'return=minimal'});
    await api('products',{method:'PATCH',query:`?id=eq.${encodeURIComponent(a[j].id)}`,body:{display_order:oi},prefer:'return=minimal'});
  },'表示順を変更しました');
}
async function toggle(id){
  const x=p.find(y=>y.id===id);if(!x)return;
  await runCloud(()=>api('products',{method:'PATCH',query:`?id=eq.${encodeURIComponent(id)}`,body:{active:!x.active,quantity:!x.active?x.qty:0,updated_at:new Date().toISOString()},prefer:'return=minimal'}),!x.active?'ONにしました':'OFFにしました');
}
function nextId(prefix,rows){
  const n=Math.max(0,...rows.map(x=>Number(String(x.id).replace(/\D/g,''))||0))+1;
  return prefix+String(n).padStart(prefix==='P'?4:3,'0');
}
async function dup(id){
  const x=p.find(y=>y.id===id);if(!x)return;
  const copy={...x,id:nextId('P',p),name:x.name+' コピー',order:Math.max(0,...p.map(y=>y.order))+1,qty:0};
  await runCloud(()=>api('products',{method:'POST',body:productToDb(copy)}),'複製しました');
}
function addNew(pref=true){
  form.reset();eid.value='';pst.textContent='商品を追加';sw.dataset.on='1';sw.classList.add('on');
  po.value=Math.max(0,...p.map(x=>x.order))+1;
  if(pref)pv.value=vs.value;
  openS(ps);
}
function edit(id){
  const x=p.find(y=>y.id===id);if(!x)return;
  eid.value=x.id;pn.value=x.name;pv.value=x.vendorId;pc.value=x.categoryId;pt.value=x.taxId;pp.value=x.net;po.value=x.order;
  sw.dataset.on=x.active?'1':'0';sw.classList.toggle('on',x.active);pst.textContent='商品を編集';openS(ps);
}

const masterConfig={
 vendor:{key:'vendors',label:'業者',field:'業者名',prefix:'V',table:'vendors'},
 category:{key:'categories',label:'科目',field:'科目名',prefix:'C',table:'categories'},
 tax:{key:'taxes',label:'税率',field:'税率（数字）',prefix:'T',table:'tax_rates'}
};
function masterRows(){return m[masterConfig[masterType].key]}
function masterDisplay(x){return masterType==='tax'?x.rate+'%':x.name}
function masterUsed(id){
  if(masterType==='vendor')return p.some(x=>x.vendorId===id);
  if(masterType==='category')return p.some(x=>x.categoryId===id);
  return p.some(x=>x.taxId===id);
}
function renderMasters(){
  mtv.classList.toggle('active',masterType==='vendor');
  mtc.classList.toggle('active',masterType==='category');
  mtt.classList.toggle('active',masterType==='tax');
  const rows=masterRows();
  mlist.innerHTML=rows.length?rows.map(x=>`<article class='master-card'><div><div class='master-name'>${esc(masterDisplay(x))}</div><div class='master-sub'>${x.id}${masterUsed(x.id)?'・商品で使用中':''}</div></div><div class='master-actions'><button onclick="editMaster('${x.id}')">編集</button><button class='danger' onclick="deleteMaster('${x.id}')">削除</button></div></article>`).join(''):`<div class='empty'>登録がありません</div>`;
}
function setMasterType(t){masterType=t;renderMasters()}
function openMasterNew(){
  mid.value='';mtype.value=masterType;mvalue.value='';
  mst.textContent=masterConfig[masterType].label+'を追加';
  mfieldlabel.textContent=masterConfig[masterType].field;
  mvalue.type=masterType==='tax'?'number':'text';
  openS(ms);
}
function editMaster(id){
  const x=masterRows().find(y=>y.id===id);if(!x)return;
  mid.value=id;mtype.value=masterType;mvalue.value=masterType==='tax'?x.rate:x.name;
  mst.textContent=masterConfig[masterType].label+'を編集';
  mfieldlabel.textContent=masterConfig[masterType].field;
  mvalue.type=masterType==='tax'?'number':'text';
  openS(ms);
}
async function deleteMaster(id){
  if(masterUsed(id)){msg('商品で使用中のため削除できません');return}
  const c=masterConfig[masterType];
  await runCloud(()=>api(c.table,{method:'DELETE',query:`?id=eq.${encodeURIComponent(id)}`,prefer:'return=minimal'}),'削除しました');
}

function screen(n){
  shop.classList.toggle('active',n==='s');db.classList.toggle('active',n==='d');master.classList.toggle('active',n==='m');
  bottom.classList.toggle('hide',n!=='s');nshop.classList.toggle('active',n==='s');ndb.classList.toggle('active',n==='d');nmaster.classList.toggle('active',n==='m');
  ht.textContent=n==='s'?'3208 買い物リスト':n==='d'?'商品データベース':'マスタ管理';
  closeD();if(n==='s')renderShop();else if(n==='d')renderDb();else renderMasters();
}
function openD(){drawer.classList.add('open');dbk.classList.add('open')}
function closeD(){drawer.classList.remove('open');dbk.classList.remove('open')}
function openS(x){ls.classList.remove('open');ps.classList.remove('open');ms.classList.remove('open');x.classList.add('open');sbk.classList.add('open')}
function closeS(){ls.classList.remove('open');ps.classList.remove('open');ms.classList.remove('open');sbk.classList.remove('open')}
function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove('show'),1500)}

mb.onclick=openD;dc.onclick=dbk.onclick=closeD;document.querySelectorAll('.cls').forEach(x=>x.onclick=closeS);sbk.onclick=closeS;
nshop.onclick=()=>screen('s');ndb.onclick=()=>screen('d');nmaster.onclick=()=>screen('m');
nlist.onclick=()=>{closeD();renderList();openS(ls)};
mtv.onclick=()=>setMasterType('vendor');mtc.onclick=()=>setMasterType('category');mtt.onclick=()=>setMasterType('tax');ma.onclick=openMasterNew;
vs.onchange=()=>{localStorage.setItem(VK,vs.value);renderShop()};
ol.onclick=()=>{renderList();openS(ls)};qa.onclick=()=>addNew(true);na.onclick=()=>addNew(false);
search.oninput=renderDb;vf.onchange=renderDb;sw.onclick=()=>{sw.dataset.on=sw.dataset.on==='1'?'0':'1';sw.classList.toggle('on',sw.dataset.on==='1')};

form.onsubmit=async e=>{
  e.preventDefault();
  const x=p.find(y=>y.id===eid.value);
  const d={id:x?.id||nextId('P',p),name:pn.value.trim(),vendorId:pv.value,categoryId:pc.value,taxId:pt.value,net:Number(pp.value),order:Number(po.value),active:sw.dataset.on==='1',qty:x?.qty||0};
  if(!d.name)return msg('商品名を入力してください');
  closeS();
  await runCloud(()=>api('products',{method:x?'PATCH':'POST',query:x?`?id=eq.${encodeURIComponent(x.id)}`:'',body:x?productToDb(d):productToDb(d),prefer:x?'return=minimal':'return=representation'}),x?'更新しました':'追加しました');
};

mform.onsubmit=async e=>{
  e.preventDefault();
  masterType=mtype.value;
  const c=masterConfig[masterType],rows=masterRows(),old=rows.find(x=>x.id===mid.value),value=mvalue.value.trim();
  if(!value)return msg('入力してください');
  let body;
  if(masterType==='tax'){
    const rate=Number(value);if(Number.isNaN(rate)||rate<0||rate>100)return msg('0〜100で入力してください');
    body={id:old?.id||nextId(c.prefix,rows),rate,display_order:old?.order||Math.max(0,...rows.map(x=>x.order||0))+1,active:true};
  }else{
    body={id:old?.id||nextId(c.prefix,rows),name:value,display_order:old?.order||Math.max(0,...rows.map(x=>x.order||0))+1,active:true};
  }
  closeS();
  await runCloud(()=>api(c.table,{method:old?'PATCH':'POST',query:old?`?id=eq.${encodeURIComponent(old.id)}`:'',body,prefer:old?'return=minimal':'return=representation'}),old?'更新しました':'追加しました');
};

loadCloud();

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  installBtn.classList.add('show');
});
installBtn.onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.classList.remove('show');
};
window.addEventListener('appinstalled',()=>{
  installBtn.classList.remove('show');
  msg('ホーム画面に追加しました');
});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(console.error);
  });
}

</script></body></html>
